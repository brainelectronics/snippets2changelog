---

# this file is *not* meant to cover or endorse the use of GitHub Actions, but
# rather to help make automated releases for this project

name: Upload Python Package to test.pypi.org

on: [pull_request]  # yamllint disable-line rule:truthy

permissions:
  contents: write

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # all history is needed to crawl it properly
          fetch-depth: 0
      - name: Count run number
        id: count
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed("This workflow must be triggered by a pull request.");
              return;
            }

            const pr_number = pr.number;
            const workflow_name = context.workflow;
            const branch_name = pr.head.ref;
            const event_match = "pull_request";
            console.log("PR Number: " + pr_number);
            console.log("Workflow name: " + workflow_name);
            console.log("Branch name: " + branch_name);

            if (!pr_number) {
              console.log("No pull request number found in context.");
              core.setOutput("count", 0);
              return;
            }

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: event_match,
              branch: branch_name,
              per_page: 100
            });

            const filtered = runs.data.workflow_runs.filter(run =>
              run.name === workflow_name &&
              run.event === event_match &&
              run.pull_requests?.some(p => p.number === pr_number)
            );
            console.log("Matches for filters aka runs: " + filtered.length);

            const count = filtered.length > 0 ? filtered.length : 1;
            core.setOutput("rc_number", count);
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Install deploy dependencies
        run: |
          # Python 3.9 compability is dropped with Poetry 2.3.0
          python -m pip install -U "poetry>2.2.0,<2.3.0" "twine>=6.2.0,<7"
          poetry install
      - name: Parse changelog
        id: parse_changelog
        run: |
          poetry run changelog-generator \
            changelog changelog.md \
            --snippets=.snippets \
            --dry-run > latest-entry.json
          echo "CHANGELOG_JSON=$(jq -c . < latest-entry.json)" >> $GITHUB_ENV
      - name: Update changelog with snippets
        id: update_changelog
        run: |
          poetry run changelog-generator \
            changelog changelog.md \
            --snippets=.snippets \
            --in-place \
            --no-internal

          poetry run changelog2version \
            --changelog_file changelog.md \
            --output changelog.json \
            --print \
            --debug

          jq -r ".info.description" changelog.json > latest_description.txt
          sed -i '/^$/d' latest_description.txt
          echo 'LATEST_DESCRIPTION<<"EOT"' >> $GITHUB_OUTPUT
          cat latest_description.txt >> $GITHUB_OUTPUT
          echo '"EOT"' >> $GITHUB_OUTPUT
          echo "latest_version=$(jq -r '.info.version' changelog.json)" >> $GITHUB_ENV
      - name: Build package
        run: |
          poetry run changelog2version \
            --changelog_file changelog.md \
            --version_file snippets2changelog/version.py \
            --version_file_type py \
            --additional_version_info="-rc${{ github.run_number }}.dev${{ github.event.number }}" \
            --debug
          poetry build
      - name: Test built package
        run: |
          twine check dist/*.tar.gz
      - name: Archive build package artifact
        uses: actions/upload-artifact@v4
        with:
          # https://docs.github.com/en/actions/learn-github-actions/contexts#github-context
          # ${{ github.repository }} and ${{ github.ref_name }} can't be used for artifact name due to unallowed '/'
          name: dist_py.${{ github.event.repository.name }}_sha.${{ github.sha }}_build.${{ github.run_number }}
          path: dist/*.tar.gz
          retention-days: 14
      - name: Publish package
        if: ${{ !contains(fromJson(env.CHANGELOG_JSON).meta.scope, 'internal') }}
        uses: pypa/gh-action-pypi-publish@release/v1.13
        with:
          repository_url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip_existing: true
          verbose: true
          print_hash: true
      - name: 'Create changelog based prerelease'
        # if: ${{ !contains(fromJson(env.CHANGELOG_JSON).meta.scope, 'internal') }}
        uses: brainelectronics/changelog-based-release@v1.2.3
        with:
          # note you'll typically need to create a personal access token
          # with permissions to create releases in the other repo
          # or you set the "contents" permissions to "write" as in this example
          changelog-path: changelog.md
          tag-name-prefix: ''
          tag-name-extension: '-rc${{ steps.count.outputs.rc_number }}.dev${{ github.event.number }}'
          release-name-prefix: ''
          release-name-extension: '-rc${{ steps.count.outputs.rc_number }}.dev${{ github.event.number }}'
          draft-release: true
          prerelease: true
